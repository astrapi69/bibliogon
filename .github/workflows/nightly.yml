name: Nightly

# Nightly slow-suite (#289). These jobs are time-intensive but rarely catch a
# real failure on a PR (in the last 30 runs: ci.yml 0 red, coverage.yml 1 red,
# complexity-check.yml 0 red). Moving them off the PR path keeps PR CI under
# ~15 min; they run nightly instead, plus on-demand via workflow_dispatch (the
# release gate triggers them manually). A nightly red surfaces in the morning
# and blocks no PR.
#
# Moved here from:
#   - ci.yml          -> plugin-tests (10-plugin matrix)
#   - coverage.yml    -> backend / plugin / frontend coverage (deleted)
#   - complexity-check.yml -> python / typescript complexity (deleted)
#   - cohesion-check.yml -> file-size-check (deleted)
#
# Security scanning is NOT here: it runs weekly in security-scan.yml.
#
# Test Impact Analysis (TIA, #332): PR CI runs SELECTIVE tests (vitest
# --changed + pytest --testmon) for speed; this Nightly is the full-suite
# safety net that re-runs everything unconditionally.
#
# TODO: Playwright TIA — a custom component->spec mapping (git-diff -> spec
# filter) would let PRs run only the affected E2E specs. Not worth it yet:
# the smoke suite is small and this Nightly full run covers it. Revisit when
# the E2E suite exceeds ~200 specs.

on:
  schedule:
    - cron: "0 3 * * *"  # daily, 03:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  learnset-schema-drift:
    name: Learnset schema drift (upstream engine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # #775: plugin-learnset VENDORS the learn-content-engine schemas +
      # validator because upstream ships no installable Python package
      # (no PyPI distribution, no [project] table in its pyproject). The
      # npm package does ship them, so compare against the pinned
      # version nightly. Deliberately NOT a PR gate: an upstream release
      # must not redden an unrelated PR.
      - name: Compare vendored artifacts against the pinned engine
        run: python scripts/check_learnset_schema_drift.py

      # #779 part 1: the drift guard above only checks the PINNED version,
      # so a new upstream release leaves the pin stale in silence. A newer
      # release is NOT a failure (the pin is deliberate and an upstream
      # publish must not redden this run) - it opens one tracking issue,
      # deduplicated on a title that is stable per version so the same
      # release never files twice.
      - name: Check for a newer learn-content-engine release
        id: upstream
        run: python scripts/check_upstream_release.py --github-output

      - name: File a tracking issue for the new release
        if: steps.upstream.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.upstream.outputs.title }}
          PINNED: ${{ steps.upstream.outputs.pinned }}
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state all --limit 100 \
            --search "$TITLE in:title" --json title,number \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$existing" ]; then
            echo "Already filed as #$existing; nothing to do."
            exit 0
          fi
          {
            echo "plugin-learnset vendors the learn-content-engine schemas +"
            echo "validator (#775). The vendored copies still match the pin, so"
            echo "the drift guard is green - but upstream has published a newer"
            echo "release."
            echo
            echo "| | version |"
            echo "|---|---|"
            echo "| pinned (\`vendor/engine-version.txt\`) | \`$PINNED\` |"
            echo "| latest on npm | \`$LATEST\` |"
            echo
            echo "This is not automatically action: the pin is deliberate. Check"
            echo "whether the new release changed the lesson schemas; if it did,"
            echo "re-vendor from the new tag, bump \`vendor/engine-version.txt\`"
            echo "and confirm \`make verify-learnset-schema\` is green."
            echo
            echo "Filed by the nightly upstream-release watcher (#779)."
          } > /tmp/upstream-issue.md
          gh issue create --title "$TITLE" --body-file /tmp/upstream-issue.md

  plugin-tests:
    name: Plugin Tests (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - bibliogon-plugin-audiobook
          - bibliogon-plugin-comics
          - bibliogon-plugin-export
          - bibliogon-plugin-getstarted
          - bibliogon-plugin-grammar
          - bibliogon-plugin-help
          - bibliogon-plugin-kdp
          - bibliogon-plugin-kinderbuch
          - bibliogon-plugin-learnset
          - bibliogon-plugin-ms-tools
          - bibliogon-plugin-translation
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Poetry virtualenv (${{ matrix.plugin }})
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ matrix.plugin }}-${{ runner.os }}-py3.12-${{ hashFiles(format('plugins/{0}/poetry.lock', matrix.plugin)) }}
          restore-keys: |
            poetry-${{ matrix.plugin }}-${{ runner.os }}-py3.12-

      - name: Install Poetry
        run: pip install poetry

      - name: Install plugin dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: poetry install --no-interaction --no-ansi

      - name: Run plugin tests
        working-directory: plugins/${{ matrix.plugin }}
        run: poetry run pytest tests/ -v

  backend-coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - name: Run backend coverage
        working-directory: backend
        run: |
          poetry run pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: |
            backend/htmlcov/
            backend/coverage.xml
          retention-days: 14

  plugin-coverage:
    name: Plugin Coverage (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: bibliogon-plugin-audiobook
            package: bibliogon_audiobook
          - plugin: bibliogon-plugin-comics
            package: bibliogon_comics
          - plugin: bibliogon-plugin-export
            package: bibliogon_export
          - plugin: bibliogon-plugin-getstarted
            package: bibliogon_getstarted
          - plugin: bibliogon-plugin-grammar
            package: bibliogon_grammar
          - plugin: bibliogon-plugin-help
            package: bibliogon_help
          - plugin: bibliogon-plugin-kdp
            package: bibliogon_kdp
          - plugin: bibliogon-plugin-kinderbuch
            package: bibliogon_kinderbuch
          - plugin: bibliogon-plugin-ms-tools
            package: bibliogon_ms_tools
          - plugin: bibliogon-plugin-translation
            package: bibliogon_translation
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install plugin dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: poetry install --no-interaction --no-ansi

      - name: Run plugin coverage
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          poetry run pytest tests/ \
            --cov=${{ matrix.package }} \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term

      - name: Upload plugin coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.plugin }}-coverage
          path: |
            plugins/${{ matrix.plugin }}/htmlcov/
            plugins/${{ matrix.plugin }}/coverage.xml
          retention-days: 14

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  python-complexity:
    name: Python complexity (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: radon + ruff C901 (warn-only)
        run: |
          python -m venv /tmp/cxenv
          /tmp/cxenv/bin/pip install --quiet --upgrade pip
          /tmp/cxenv/bin/pip install --quiet radon ruff
          echo "=== radon cyclomatic complexity (average; rank B and worse) ==="
          /tmp/cxenv/bin/radon cc backend/app/ -a -nb
          echo ""
          echo "=== radon: functions with rank E or F (complexity warning) ==="
          /tmp/cxenv/bin/radon cc backend/app/ -ne
          echo ""
          echo "=== ruff C901 (max-complexity=15, warn-only) ==="
          # --exit-zero: warn-only. C901 is deliberately NOT in the blocking
          # `select` of pyproject.toml; the threshold (max-complexity=15,
          # Phase 2 #279) comes from [tool.ruff.lint.mccabe]. The five legacy
          # functions above 15 carry `# noqa: C901`, so this surfaces only
          # NEW >15 functions.
          (cd backend && /tmp/cxenv/bin/ruff check app/ --select C901 --exit-zero)

  typescript-complexity:
    name: TypeScript complexity (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: ESLint complexity (warn-only)
        working-directory: frontend
        run: |
          npm ci
          echo "=== ESLint complexity (threshold 15, warn-only) ==="
          # `|| true`: the watcher never blocks (Phase 2 #279, still warn-only).
          # The `complexity` rule is NOT in the base eslint.config.js, so the
          # functions already above 15 surface here as warnings rather than
          # carrying inline disables. Counts + rationale:
          # docs/audits/clean-code-audit.md.
          npx eslint --rule 'complexity: ["warn", 15]' src/ || true

  file-size-check:
    name: Cohesion file-size check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check file sizes
        run: |
          chmod +x scripts/check-file-sizes.sh
          scripts/check-file-sizes.sh

  # #779 part 2: a red nightly can go unnoticed for weeks - the web-speech
  # spec was red for 14 consecutive nights before anyone looked (#711/#712).
  # This job holds ONE tracking issue per workflow: it opens or comments on
  # failure and closes it on the next green run, so the signal is never
  # spam and never silent. It is the only job allowed to touch issues, and
  # `if: always()` means it reports even when an upstream job was cancelled.
  nightly-alarm:
    name: Report nightly status
    runs-on: ubuntu-latest
    if: always()
    needs: [learnset-schema-drift, plugin-tests, backend-coverage, plugin-coverage, frontend-coverage, python-complexity, typescript-complexity, file-size-check]
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Nightly workflow is red"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Open, comment on, or close the tracking issue
        run: |
          set -euo pipefail
          open_number=$(gh issue list --state open --limit 100 \
            --search "$TITLE in:title" --json title,number \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ "$FAILED" = "true" ]; then
            if [ -n "$open_number" ]; then
              gh issue comment "$open_number" \
                --body "Still red: $RUN_URL"
              echo "Commented on #$open_number."
            else
              printf '%s\n' \
                "The Nightly workflow went red. This issue tracks it and closes" \
                "automatically on the next green run." \
                "" \
                "First failing run: $RUN_URL" \
                "" \
                "Opened by the red-nightly alarm (#779)." > /tmp/alarm.md
              gh issue create --title "$TITLE" --body-file /tmp/alarm.md
            fi
          else
            if [ -n "$open_number" ]; then
              gh issue close "$open_number" \
                --comment "Green again: $RUN_URL"
              echo "Closed #$open_number."
            else
              echo "Green, and nothing was open."
            fi
          fi
