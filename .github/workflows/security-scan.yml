name: Security Scan

# Dependency-security watcher (#149). The PR/push enforcement already
# lives in ci.yml (pip-audit + bandit + npm audit, all hard-blocking on
# every push/PR to main/develop). This watcher closes the remaining gap:
# new CVEs published against already-merged dependencies are invisible
# without a code change, because ci.yml only triggers on push/PR.
#
# Defense-in-depth Phase 2 (#278): the watcher now BLOCKS on Critical/High
# findings instead of warning. Concretely:
#   - pip-audit  real exit code; accepted advisories live in
#                .security-ignore.yml (parsed by scripts/security_ignore_args.py)
#                so nothing is ignored silently.
#   - bandit     High severity blocks; Low/Medium stay warn-only.
#   - npm audit  --audit-level=high with a real exit code.
# The launcher tree joined the gate in #1047: it is frozen into the binary
# attached to every release, so its lock ships to users.
# The trigger stays Weekly + manual dispatch (no PR trigger - that gate is
# ci.yml). A red here means a new advisory landed against a merged
# dependency; triage it, then either fix or add a justified entry to
# .security-ignore.yml.

on:
  schedule:
    - cron: "0 7 * * 0"  # weekly, Sunday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      # `poetry sync` rather than `poetry install`: `install` never REMOVES a
      # package that left the lock, so an environment that outlives one lock
      # is audited for vulnerabilities it would not have if installed from
      # the repo - which is what pypdf 6.18.1 does to a long-lived developer
      # venv (#952). This job builds a fresh venv every run (no cache step),
      # so sync changes nothing here today; it makes the audited environment
      # equal to the lockfile BY CONSTRUCTION, so adding a cache later cannot
      # quietly reintroduce the problem. The workflows that do cache a venv
      # are covered in #980.
      - name: Install backend dependencies (synced to the lockfile)
        working-directory: backend
        run: poetry sync --no-interaction --no-ansi

      # pip is the virtualenv's own installer, not a dependency of
      # Bibliogon - no pyproject pins it and no lock carries it - but
      # pip-audit scans the installed environment, so an outdated seeded pip
      # fails the gate with nothing in the repo to change. The venv is
      # restored from cache across runs, so the seed never ages out by
      # itself. Upgrade the tool instead (#952).
      - name: Upgrade the venv's own pip before auditing it
        working-directory: backend
        run: poetry run python -m pip install --quiet --upgrade pip

      - name: pip-audit (Phase 2 - blocks on non-ignored advisories)
        working-directory: backend
        run: |
          echo "=== pip-audit (dependency CVEs; --skip-editable drops path-installed plugins) ==="
          IGNORE=$(poetry run python ../scripts/security_ignore_args.py)
          echo "accepted advisories (see .security-ignore.yml): ${IGNORE:-none}"
          poetry run pip-audit --skip-editable $IGNORE

      - name: bandit (Phase 2 - High blocks, Low/Medium warn)
        working-directory: backend
        run: |
          echo "=== bandit High severity (blocking) ==="
          poetry run bandit -c pyproject.toml \
            -r app ../plugins ../scripts \
            --severity-level high --confidence-level medium -q
          echo "=== bandit Low/Medium severity (warn-only) ==="
          poetry run bandit -c pyproject.toml \
            -r app ../plugins ../scripts \
            --severity-level medium --confidence-level medium -q || true

  # The launcher is not dev tooling: `make release-*` freezes this tree with
  # PyInstaller and attaches the binary to the GitHub release, so whatever
  # `launcher/poetry.lock` resolves is shipped to users embedded in that
  # artifact (#1047). Until now it was watched by hand - the `pillow` pin
  # still carries the six CVE numbers somebody read advisories to find - and
  # a hand is not a mechanism. Blocking, because the artifact ships.
  #
  # Still unaudited after this: `e2e/` (Playwright) and `docs/` (MkDocs),
  # both dev-only. #1047 phase 2, advisory first.
  #
  # pip-audit lives in the launcher's dev group rather than being installed
  # here, so the audited environment equals the lockfile - the same
  # convention as the backend job, including the consequence that an
  # advisory against the auditor's own tree fails this gate. That is what
  # .security-ignore.yml is for. It never reaches a user: PyInstaller
  # bundles what the launcher imports, and nothing imports pip-audit.
  launcher-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      # `sync`, not `install`, for the same reason as the backend job above:
      # the audited environment has to equal the lockfile by construction.
      - name: Install launcher dependencies (synced to the lockfile)
        working-directory: launcher
        run: poetry sync --no-interaction --no-ansi

      - name: Upgrade the venv's own pip before auditing it
        working-directory: launcher
        run: poetry run python -m pip install --quiet --upgrade pip

      - name: pip-audit (blocks on non-ignored advisories)
        working-directory: launcher
        run: |
          echo "=== pip-audit (launcher tree; ships inside the frozen binary) ==="
          IGNORE=$(poetry run python ../scripts/security_ignore_args.py)
          echo "accepted advisories (see .security-ignore.yml): ${IGNORE:-none}"
          poetry run pip-audit --skip-editable $IGNORE

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (Phase 2 - blocks on high + critical)
        working-directory: frontend
        run: |
          echo "=== npm audit (high + critical advisories) ==="
          npm audit --audit-level=high

  security-alarm:
    name: Red-run alarm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [python-security, launcher-security, frontend-security]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # #951: a scheduled workflow is not a required check, so a red run
      # surfaces nowhere unless someone opens the Actions tab. One tracking
      # issue per workflow, closed automatically on the next green run.
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result=success
          case "$JOB_RESULTS" in
            *failure*|*timed_out*) result=failure ;;
          esac
          echo "job results: $JOB_RESULTS -> $result"
          python scripts/nightly_alarm.py \
            --workflow "Security Scan" --result "$result" --run-url "$RUN_URL"
