name: Mutation Testing (Import Orchestrator)

# Scoped mutmut run for the core import orchestrator and its handlers.
# Issue context:
#   - app/import_plugins/ + app/routers/import_orchestrator.py have strong
#     line coverage but no mutation-score evidence yet.
#   - Acceptance criteria from the issue: >= 60% mutation score on
#     app/import_plugins/, triage of survivors in _sanitise_rel_path /
#     _check_duplicate, audit doc under docs/audits/.
#   - Initial run is 20-40 min CPU; not part of the per-PR loop.
#
# On/off switch
# -------------
# This workflow is ON by default for scheduled runs (#721).
#
#   * Scheduled runs (nightly 02:00 UTC) execute unless the repository
#     variable DISABLE_NIGHTLY_MUTATION is set to "true". Set / unset it
#     in Settings -> Secrets and variables -> Actions -> Variables.
#     No code change required to flip it.
#
#   * workflow_dispatch (manual "Run workflow" button) always runs
#     regardless of the variable, so a maintainer can do a one-off
#     audit even while the nightly is disabled.
#
# Was previously opt-IN behind ENABLE_NIGHTLY_MUTATION. That variable was
# never set, so from the 2026-05-02 wiring until #721 every scheduled run
# reported "skipped" and no mutation score was ever tracked after the
# 2026-05-14 manual baseline -- the "wired infrastructure that never ran"
# failure mode in .claude/rules/lessons-learned.md. Defaulting to ON makes
# a silent non-run impossible; the kill switch is preserved, just inverted.

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC nightly
  workflow_dispatch:
    inputs:
      paths:
        description: "Override paths to mutate (comma-separated, defaults to import scope)"
        required: false
        default: ""

permissions:
  contents: read

# Defensive opt-in: any JavaScript-runtime action still declaring
# Node 20 (third-party or stragglers) is coerced to Node 24. After
# the 2026-05-14 standard-action bumps (checkout v5, setup-python v6,
# setup-node v5, upload-artifact v6, cache v5, configure-pages v6,
# upload-pages-artifact v5, deploy-pages v5, softprops/action-gh-release v3)
# every action we use natively runs on Node 24, so this is now a
# safety net for future additions rather than an active fix.
# Default Node 20 is removed September 16th 2026 per
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  mutmut-import:
    name: mutmut (import scope)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || vars.DISABLE_NIGHTLY_MUTATION != 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      # mutmut reuses an existing mutants/ tree instead of regenerating,
      # so restoring an incompatible one silently poisons the run: it dies
      # in ~30s and `|| true` reports success (#721).
      #
      # The key therefore hashes everything that decides what the tree
      # should contain, pyproject.toml included -- it holds
      # paths_to_mutate/tests_dir and the mutmut version pin, and a change
      # to either invalidates every cached mutant. The old key hashed
      # app/routers/import_orchestrator.py (no longer in scope) and missed
      # both pyproject.toml and app/services/, so scope changes could not
      # invalidate it.
      #
      # restore-keys is deliberately absent. A prefix fallback restores the
      # newest cache with a matching prefix even when the exact key misses,
      # which is precisely how a broken tree from an earlier run gets
      # replayed forever. A miss now means a clean full run instead.
      - name: Restore mutmut cache
        uses: actions/cache@v5
        with:
          path: backend/mutants/
          key: mutmut-v2-${{ hashFiles('backend/pyproject.toml', 'backend/app/import_plugins/**', 'backend/app/services/**', 'backend/tests/**') }}

      - name: Override mutmut scope in pyproject.toml
        working-directory: backend
        env:
          INPUT_PATHS: ${{ github.event.inputs.paths }}
        run: |
          # mutmut v3 reads paths_to_mutate from pyproject.toml, and that
          # is the single source of truth for the scope (#721). Only a
          # workflow_dispatch `paths` input rewrites it; with no input we
          # leave pyproject.toml alone. The CI workspace is throwaway, so
          # the rewrite needs no restore.
          #
          # This step used to hardcode a default of
          #   ["app/import_plugins/", "app/routers/import_orchestrator.py"]
          # which had drifted from pyproject's
          #   ["app/import_plugins/", "app/services/"]
          # and, worse, broke every run: naming a single FILE under
          # app/routers/ makes mutmut create mutants/app/routers/
          # containing only that file. tests/conftest.py symlinks missing
          # siblings of app/ back to the real tree but skips any entry that
          # already exists, so a partially-copied package stays partial and
          # the harness dies with
          #   ImportError: cannot import name 'ai_template_bulk' from 'app.routers'
          # Whole-directory scopes (what pyproject declares) do not have
          # this problem. Keep dispatch overrides to directories.
          python <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          override = os.environ.get("INPUT_PATHS", "").strip()
          if not override:
              print("No paths input -- using pyproject.toml scope as-is")
              sys.exit(0)
          entries = [p.strip() for p in override.split(",") if p.strip()]
          paths_repr = "[" + ", ".join(f'"{p}"' for p in entries) + "]"

          pp = Path("pyproject.toml")
          text = pp.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(\[tool\.mutmut\][^\[]*?paths_to_mutate\s*=\s*)\[[^\]]*\]",
              re.DOTALL,
          )
          new_text, count = pattern.subn(rf"\g<1>{paths_repr}", text, count=1)
          if count == 0:
              raise SystemExit("Failed to locate paths_to_mutate in pyproject.toml")
          pp.write_text(new_text, encoding="utf-8")
          print(f"Scoped paths_to_mutate -> {paths_repr}")
          PY

      - name: Run mutmut
        working-directory: backend
        run: |
          # mutmut exits non-zero when survivors exist; still want artifacts
          poetry run mutmut run || true

      - name: Print mutmut results summary
        working-directory: backend
        run: poetry run mutmut results || true

      # mutmut 3.5 has no `html` subcommand -- the step that used to live
      # here ran `mutmut html` and only ever printed
      # "Error: No such command 'html'", swallowed by `|| true` (#721).
      # `export-cicd-stats` is the machine-readable equivalent and writes
      # mutants/mutmut-cicd-stats.json (killed / survived / no_tests /
      # timeout / total), which the upload step below already collects.
      - name: Export mutation stats
        working-directory: backend
        run: poetry run mutmut export-cicd-stats || true

      # Liveness guard, NOT a score gate (#721). Every other step ends in
      # `|| true` because mutmut exits non-zero whenever survivors exist,
      # and that blanket suppression has now reported "success" three
      # times for a run that checked nothing at all: 2026-05-12 (71s),
      # and twice on 2026-08-16 (61s, 89s). This fails only when the tool
      # produced no verdict for a single mutant, which is always a broken
      # run rather than a quality signal. Survivors still pass.
      - name: Verify the run actually checked mutants
        working-directory: backend
        run: |
          python <<'PY'
          import json
          import sys
          from pathlib import Path

          stats_path = Path("mutants/mutmut-cicd-stats.json")
          if not stats_path.exists():
              sys.exit(f"{stats_path} missing -- mutmut produced no stats at all")

          stats = json.loads(stats_path.read_text(encoding="utf-8"))
          total = stats.get("total", 0)
          checked = sum(
              stats.get(k, 0)
              for k in ("killed", "survived", "no_tests", "timeout", "suspicious", "skipped")
          )
          killed = stats.get("killed", 0)
          scored = killed + stats.get("survived", 0)
          print(f"total={total} checked={checked} " + " ".join(f"{k}={v}" for k, v in stats.items()))
          # Two denominators, because they answer different questions and
          # the audit doc uses the first: killed/total counts mutants with
          # no covering test against you, killed/(killed+survived) scores
          # only the mutants a test actually exercised. Reporting one alone
          # invites comparing against the other.
          if total:
              print(f"score vs total:     {killed}/{total} = {100 * killed / total:.1f}%")
          if scored:
              print(f"score vs exercised: {killed}/{scored} = {100 * killed / scored:.1f}%")
          if total and not checked:
              sys.exit(
                  "mutmut checked 0 of "
                  f"{total} mutants -- the run aborted (commonly a poisoned "
                  "mutants/ cache or a stats-collection crash). See the "
                  "'Run mutmut' step output."
              )
          PY

      - name: Upload mutmut artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutmut-import-${{ github.run_id }}
          # backend/html/ dropped: it was the output of the `mutmut html`
          # step, and mutmut 3.5 has no such command, so it never existed
          # (upload-artifact warned "no files found" for it). The stats
          # JSON lands in backend/mutants/ alongside the mutant tree.
          path: backend/mutants/
          retention-days: 30
