name: Visual Regression

# Pixel-diff visual regression (Playwright toHaveScreenshot) NIGHTLY, never
# on PRs: committed screenshots change on every intentional UI PR, so gating
# PRs on them would block legitimate layout changes. Same model as the
# e2e-smoke + security-scan workflows: a long-running suite once a day, plus
# on-demand via workflow_dispatch. NOT a required check.
#
# Scheduled at 04:00 UTC, after the Nightly slow-suite (03:00) so the two
# heavy Playwright runs don't contend for the runner at the same minute.
#
# The `visual` project drives the real backend API (seeding books/articles),
# so playwright.config.ts's `webServer` launches BOTH servers (uvicorn :8000
# + Vite :5173). On a failing diff, Playwright writes the actual/expected/diff
# PNGs under e2e/test-results/, uploaded as an artifact for review.
#
# Baseline updates (when a UI change is intentional): dispatch with the
# `update_snapshots` input below. The regenerated PNGs are pushed to a
# `chore/visual-baselines-<run-id>` branch, so reviewing them is a normal
# diff and opening the pull request is the only manual step; they are also
# still uploaded as an artifact. `make test-visual-update` does the same
# locally. See e2e/visual/README.md.

on:
  schedule:
    - cron: "0 4 * * *" # nightly at 04:00 UTC (after the 03:00 slow-suite)
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate baseline screenshots (--update-snapshots)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Write access is needed only to push a regenerated-baseline branch on an
    # explicit `update_snapshots` dispatch; the scheduled run never pushes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-backend-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-backend-${{ runner.os }}-py3.12-

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend (uvicorn server for the E2E webServer)
        working-directory: backend
        run: poetry sync --no-interaction --no-ansi

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend deps (Vite dev server)
        working-directory: frontend
        run: npm ci

      - name: Install E2E deps (Playwright)
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run visual regression
        working-directory: e2e
        run: |
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ]; then
            npx playwright test --project=visual --update-snapshots
          else
            npx playwright test --project=visual --retries=1
          fi

      # On a failing diff Playwright writes actual/expected/diff PNGs here.
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: visual-regression-diff
          path: e2e/test-results/
          retention-days: 7

      # When dispatched with update_snapshots, surface the regenerated
      # baselines as an artifact as well. `always()` is required:
      # `--update-snapshots` exits non-zero (Playwright reports updated
      # snapshots as failures), so without it this step's implicit success()
      # gate skips the upload.
      - uses: actions/upload-artifact@v6
        if: ${{ always() && github.event.inputs.update_snapshots == 'true' }}
        with:
          name: visual-regression-baselines
          path: e2e/visual/**/*-snapshots/**
          retention-days: 7

      # #950: an artifact was the ONLY way the regenerated PNGs left the
      # runner, and artifact downloads are served from blob storage, which an
      # agent session cannot reach - so the refresh was a human-only step and
      # the gate stayed red for a month on two intended UI changes. Pushing a
      # branch makes the new baselines reviewable as an ordinary diff by
      # whoever (or whatever) dispatched the run.
      #
      # Committed as the dispatching actor, which is accurate (a person asked
      # for this refresh) and keeps the #768/#786 identity guard satisfied -
      # `github-actions[bot]` would carry the `[bot]` marker it refuses.
      - name: Push the regenerated baselines to a branch
        if: ${{ always() && github.event.inputs.update_snapshots == 'true' }}
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          BRANCH: chore/visual-baselines-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- e2e/visual)" ]; then
            echo "Baselines are byte-identical; nothing to push." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- e2e/visual
          git commit -m "test(visual): regenerate baseline screenshots" \
            -m "Regenerated by Visual Regression run ${{ github.run_id }}."
          git push origin "$BRANCH"
          {
            echo "### Regenerated baselines pushed"
            echo
            echo "Branch \`$BRANCH\`, $(git diff --name-only HEAD~1 -- e2e/visual | wc -l) screenshot(s) changed:"
            echo
            git diff --name-only HEAD~1 -- e2e/visual | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  visual-alarm:
    name: Red-run alarm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A dispatch with update_snapshots exits non-zero by design (Playwright
    # reports regenerated baselines as failures), so it must not raise an
    # alarm about a workflow that did exactly what it was asked to do.
    if: always() && github.event.inputs.update_snapshots != 'true'
    needs: [visual]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # #951: a scheduled workflow is not a required check, so a red run
      # surfaces nowhere unless someone opens the Actions tab. One tracking
      # issue per workflow, closed automatically on the next green run.
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ needs.visual.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/nightly_alarm.py \
            --workflow "Visual Regression" --result "$JOB_RESULT" --run-url "$RUN_URL"
