name: E2E Smoke Tests

# Runs the Playwright smoke suite NIGHTLY (not on PRs). The serial suite
# takes ~90 minutes against a live backend, so gating every PR on it stalls
# the dev cycle while the real code-quality gates (Vitest, tsc, ESLint, ruff,
# mypy, cohesion, complexity) finish in 5-10 min. Same model as the
# security-scan + mutation-testing workflows: a long-running suite runs once
# a day, plus on-demand via workflow_dispatch. It is NOT a required check;
# before a release Aster runs it manually (`make test-e2e-smoke`, part of the
# release checklist). Complements (does not replace) the local pre-release gate.
#
# The suite is NOT pure Dexie/offline - it drives the real backend API
# (creating books/articles, the backup cycle, etc.). playwright.config.ts's
# `webServer` already launches BOTH servers automatically: uvicorn (:8000,
# isolated /tmp data dir, BIBLIOGON_DEBUG) and the Vite dev server (:5173,
# which proxies /api -> :8000). So this job only has to install the deps
# those commands need: Python + Poetry + backend deps (incl. the path-dep
# plugins) for uvicorn, and `npm ci` in both frontend/ (the dev server) and
# e2e/ (Playwright lives there). Retries (2) come from the existing config.

on:
  schedule:
    - cron: "0 3 * * *" # nightly at 03:00 UTC
  workflow_dispatch: {}

# The alarm job files and closes the tracking issue (#779).
permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    # Pinned (#1166): ubuntu-latest moved to 26.04, where Playwright 1.60
    # cannot install its browser; the visual baselines come from 24.04.
    runs-on: ubuntu-24.04
    # The smoke project is the full serial regression suite (500+ tests,
    # workers=1 against a live backend), so a run is long by nature. Cap it
    # so a stall fails fast and visibly instead of grinding to GitHub's 6h
    # default (the #167 "hang" was an uncapped slow run, not a true freeze).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache Poetry virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-backend-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-backend-${{ runner.os }}-py3.12-

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend (uvicorn server for the E2E webServer)
        working-directory: backend
        run: poetry sync --no-interaction --no-ansi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend deps (Vite dev server)
        working-directory: frontend
        run: npm ci

      - name: Install E2E deps (Playwright)
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run smoke suite
        working-directory: e2e
        # retries:2 (the shared playwright.config.ts default; no CLI override).
        # With workers:1 (SQLite, no parallelism) the residual flakes are
        # load/stability timeouts where an element resolves but isn't
        # actionable in time; these occasionally fail TWO attempts under
        # runner load, so a 3rd attempt is what keeps the gate honest without
        # masking a deterministic failure (which fails all three). Retries
        # only re-run the FEW failed tests, so the wall-clock cost over
        # --retries=1 is marginal.
        run: npx playwright test --project=smoke

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 7

  smoke-alarm:
    name: Red-nightly alarm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # #779: this suite is not a required check, so a red run surfaces
      # nowhere unless someone opens the Actions tab. One tracking issue per
      # workflow, closed automatically on the next green run.
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ needs.smoke.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/nightly_alarm.py \
            --workflow "E2E Smoke Tests" --result "$JOB_RESULT" --run-url "$RUN_URL"
