# Explicit project name so containers are deterministically prefixed
# "bibliogon-*" regardless of the install directory name. Without this,
# Compose derives the project name from the directory basename, which can
# collide with another local Compose project installed in a similarly
# named folder (the launcher also passes -p bibliogon as a backstop).
name: bibliogon

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - bibliogon-data:/app/data
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - BIBLIOGON_DEBUG=false
      # Single canonical data dir. DB lives at $DATA_DIR/bibliogon.db
      # and uploads at $DATA_DIR/uploads/, both inside the named
      # volume so they survive container rebuilds. The volume mount
      # at /app/data is the persistence boundary.
      - BIBLIOGON_DATA_DIR=/app/data
      - BIBLIOGON_CORS_ORIGINS=${BIBLIOGON_CORS_ORIGINS:-http://localhost:7880}
      - BIBLIOGON_SECRET_KEY=${BIBLIOGON_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    # Published on the loopback interface only. Bibliogon has no
    # authentication - the threat model names the host machine as the trust
    # boundary - so the artifact must not be reachable from the network
    # unless somebody chooses that. Set BIBLIOGON_BIND_ADDRESS=0.0.0.0 to
    # open it deliberately, and read docs/help/*/developers/deployment.md
    # before doing so (#710).
    ports:
      - "${BIBLIOGON_BIND_ADDRESS:-127.0.0.1}:${BIBLIOGON_PORT:-7880}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bibliogon-data:
