# Accepted / deferred security advisories - single source of truth.
#
# Consumed by:
#   - .github/workflows/security-scan.yml (weekly blocking watcher, Phase 2)
#   - `make check-security`
# via scripts/security_ignore_args.py, which turns each entry below into a
# `--ignore-vuln <id>` argument for pip-audit.
#
# Rules for every entry:
#   - `id`        the advisory / CVE identifier passed to pip-audit.
#   - `package`   the affected dependency (documentation only).
#   - `reason`    why the advisory is accepted / deferred. Be specific.
#   - `tracking`  the GitHub issue tracking the eventual fix.
#   - `review_by` the date by which the deferral must be re-evaluated.
#
# Nothing is ignored silently: a removed entry makes the advisory block the
# watcher again. Review the whole list at least quarterly.
ignored:
  - id: PYSEC-2026-3412
    package: weasyprint
    reason: >
      CSS injection through unescaped presentational-hint attribute values.
      Reachable only with presentational_hints=True; all three WeasyPrint
      call sites (bibliogon_export picture_book_pdf, bibliogon_comics
      comic_book_pdf, bibliogon_kdp manuscript_pdf) construct
      HTML(string=...) and so keep the default presentational_hints=False.
      Still unfixed upstream as of weasyprint 70.0 - there is nothing to
      upgrade to.
    tracking: "#717"
    review_by: "2026-11-16"
  - id: PYSEC-2026-2132
    package: click
    reason: >
      Command injection in click.edit(). Bibliogon never calls click.edit();
      click is a transitive dependency only (gtts, uvicorn, mutmut). The fix
      is click 8.3.3, which is unreachable while gtts 2.5.4 (the latest
      release) caps click at ">=7.1,<8.2".
    tracking: "#717"
    review_by: "2026-11-16"
