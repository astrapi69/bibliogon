[tool.poetry]
name = "bibliogon-plugin-promotion"
version = "0.60.0"
description = "Author-promotion module: per-format portfolio board over a book's retail presence"
authors = ["astrapi69"]
license = "MIT"
readme = "README.md"
packages = [{include = "bibliogon_promotion"}]

[tool.poetry.dependencies]
python = "^3.11"
pluginforge = "^0.10.0"
fastapi = "^0.136.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^7.1.0"
httpx = "^0.28.0"

[tool.poetry.plugins."bibliogon.plugins"]
promotion = "bibliogon_promotion.plugin:PromotionPlugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
